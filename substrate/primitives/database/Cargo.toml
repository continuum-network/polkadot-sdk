[package]
name = "sp-database"
version = "10.0.1"
authors.workspace = true
edition.workspace = true
license = "Apache-2.0"
homepage.workspace = true
repository.workspace = true
description = "Substrate database trait."
documentation = "https://docs.rs/sp-database"
readme = "README.md"

[lints]
workspace = true

[dependencies]
kvdb = { workspace = true }
kvdb-rocksdb = { optional = true, workspace = true }
# Feature-only: aws-lc-fips-sys (rustls FIPS, used by sc-network) builds with bindgen 0.73, which
# turns on clang-sys `runtime`; librocksdb-sys's bindgen must then load libclang at runtime too.
librocksdb-sys = { optional = true, features = ["bindgen-runtime"], workspace = true }
parking_lot = { workspace = true, default-features = true }

[features]
default = []
rocksdb = ["kvdb-rocksdb", "librocksdb-sys"]
